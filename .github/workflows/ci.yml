---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-actions-lint-and-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-actions-lint-and-scan.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      search-path: .github/workflows
      go-version: stable
      python-version: 3.x
  markdown-lint:
    uses: dceoy/gha-for-devops/.github/workflows/markdown-lint.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      search-path: .
  python-lint-and-scan:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/python-package-lint-and-scan.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      package-path: .
  python-test:
    permissions:
      contents: read
    uses: dceoy/gha-for-devops/.github/workflows/python-package-test.yml@c073f5aac73a01f514f576ad5e7837fdbee7e96e  # v2.3.6
    with:
      package-path: .
  validate-market-data-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d   # v10.4.0
      - run: uv sync
      - name: Validate CFD instruments
        run: |
          uv run python \
            -m aims.validate_cfd_instruments \
            --input data/cfd_instruments.csv \
            --schema data/schema/cfd_instruments.schema.json
      - name: Validate instrument mappings
        run: |
          uv run python \
            -m aims.mappings \
            --input data/mappings/canonical_instrument_mappings.csv \
            --cfd-instruments data/cfd_instruments.csv
      - name: Validate calendars
        run: |
          for CAL in data/calendars/*.json; do
            uv run python -m aims.validate_calendar --input "$CAL"
          done
